<style>
  html, body { margin:0; height:100%; background:#0a0a0c; overflow:hidden; font-family: system-ui, sans-serif; }
  #ui {
    position:fixed; left:12px; top:12px; z-index:10;
    color:#f2e6c9; font-size:13px; line-height:1.45;
    background:rgba(10,10,14,0.72); border:1px solid rgba(232,172,46,0.35);
    border-radius:10px; padding:10px 12px; max-width:260px;
    pointer-events:none; backdrop-filter:blur(6px);

  #ui b { color:#e8ac2e; }
  #ui .warn { color:#ff4d7a; }
  #ui .good { color:#2bb89f; }
  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    color:#cfc6b0; font-size:12px; background:rgba(0,0,0,0.55);
    padding:8px 14px; border-radius:8px; z-index:10; text-align:center;
    pointer-events:none; max-width:90vw;
  }
  #enterVR {
    position:fixed; right:14px; bottom:14px; z-index:12;
    font-weight:700; font-size:14px; letter-spacing:0.4px;
    color:#141414; background:#e8ac2e; border:none; border-radius:10px;
    padding:12px 16px; cursor:pointer;
  }
  #enterVR:hover { filter:brightness(1.08); }
</style>

            grabbable-object="kind: cushion">
    <a-cylinder radius="0.22" height="0.09"
                material="color: #5b6dff; roughness: 0.9"></a-cylinder>
    <a-text value="REST" align="center" width="0.9" position="0 0.14 0" color="#c9d0ff"></a-text>
  </a-entity>

  <!-- Camera / rig — standing just in front of the cluster -->
  <a-entity id="rig" position="0 0 2.05">
    <a-camera id="cam" look-controls wasd-controls="acceleration: 18" position="0 1.5 0">
      <a-cursor id="cursor"
                raycaster="objects: .grabbable, .box-drop; far: 6"
                geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.014"
                material="color: #e8ac2e; shader: flat"
                position="0 0 -0.9"></a-cursor>
    </a-camera>
    <!-- Quest 3: laser-controls handles controllers + hands; ray for grab targeting -->
    <a-entity id="leftHand"
              laser-controls="hand: left"
              raycaster="objects: .grabbable, .box-drop; far: 8; lineColor: #e8ac2e; lineOpacity: 0.7"
              hand-controls="hand: left; handModelStyle: lowPoly; color: #ececec"></a-entity>
    <a-entity id="rightHand"
              laser-controls="hand: right"
              raycaster="objects: .grabbable, .box-drop; far: 8; lineColor: #e8ac2e; lineOpacity: 0.7"
              hand-controls="hand: right; handModelStyle: lowPoly; color: #ececec"></a-entity>
  </a-entity>

</a-scene>

<script>
(function () {
  const SAVE_KEY = 'sunSorb_vr_v1';
  const defaultState = {
    hunger: 80, joy: 80, energy: 80, clean: 80,
    cycle: 1, alive: true, sleeping: false, seconds: 0,
    name: 'Sorb', lastIntruderCycle: 0
  };
  let state = { ...defaultState };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) state = { ...defaultState, ...JSON.parse(raw) };
  } catch (e) {}
  // Never leave the player stuck with a dead/starved save
  if (!state.alive || state.hunger < 15 || state.energy < 15) {
    state.alive = true;
    state.hunger = Math.max(state.hunger, 40);
    state.joy = Math.max(state.joy, 40);
    state.energy = Math.max(state.energy, 40);
    state.clean = Math.max(state.clean, 40);
  }

  let intruderActive = false;
  let intruderTimer = null;
  let held = null; // { el, kind, offset }
  let sorbHidden = false;
  let lastAction = 0;
  let muted = false;
  let audioUnlocked = false;
  let zeroNeedStreak = 0;

  const bgMusic = () => document.getElementById('bgMusic');
  const stinger = () => document.getElementById('intruderStinger');
  const amb = () => document.getElementById('intruderAmb');

  function applyMute() {
    [bgMusic(), stinger(), amb()].forEach((a) => {
      if (a) a.muted = muted;
    });
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    const bg = bgMusic();
    if (bg) {
      bg.volume = 0.35;
      bg.play().catch(() => {});
    }
    // prime the other clips
    [stinger(), amb()].forEach((a) => {
      if (!a) return;
      a.volume = 0.01;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.volume = 0.85; }).catch(() => {});
    });
  }

  function playBg() {
    const bg = bgMusic();
    if (!bg || muted) return;
    bg.volume = 0.35;
    bg.play().catch(() => {});
  }

  function stopBg() {
    const bg = bgMusic();
    if (!bg) return;
    try { bg.pause(); } catch (e) {}
  }

  function startIntruderAudio() {
    unlockAudio();
    const bg = bgMusic();
    const s = stinger();
    const a = amb();
    // duck background
    if (bg) {
      try { bg.volume = 0.06; } catch (e) {}
    }
    if (s) {
      try {
        s.muted = muted;
        s.volume = 0.9;
        s.currentTime = 0;
        s.play().catch(() => {});
      } catch (e) {}
    }
    if (a) {
      try {
        a.muted = muted;
        a.volume = 0.55;
        a.currentTime = 0;
        a.play().catch(() => {});
      } catch (e) {}
    }
  }

  function stopIntruderAudio() {
    const s = stinger();
    const a = amb();
    const bg = bgMusic();
    if (s) { try { s.pause(); s.currentTime = 0; } catch (e) {} }
    if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} }
    if (bg && !muted) {
      bg.volume = 0.35;
      bg.play().catch(() => {});
    }
  }

  const $ = (id) => document.getElementById(id);
  const ui = {
    h: $('h'), j: $('j'), e: $('e'), c: $('c'),
    mood: $('moodLine'), event: $('eventLine'), log: $('logLine'),
    name: $('nameLabel'), cycle: $('cycleLabel')
  };

  // TV screen canvas
  const tvCanvas = document.createElement('canvas');
  tvCanvas.width = 512;
  tvCanvas.height = 320;
  const tvCtx = tvCanvas.getContext('2d');
  let tvTexture = null;
  let lastTvLog = '';

  function ensureTvTexture() {
    const screen = $('tvScreen');
    if (!screen || !screen.object3D) return;
    const mesh = screen.getObject3D('mesh');
    if (!mesh || !mesh.material) return;
    if (!tvTexture) {
      tvTexture = new THREE.CanvasTexture(tvCanvas);
      tvTexture.needsUpdate = true;
      mesh.material.map = tvTexture;
      mesh.material.color.set('#ffffff');
      mesh.material.needsUpdate = true;
    } else {
      tvTexture.needsUpdate = true;
    }
  }

  function barColor(v) {
    if (v <= 25) return '#ff4d7a';
    if (v <= 50) return '#e8ac2e';
    return '#2bb89f';
  }

  function drawTVScreen(mood, eventText) {
    const ctx = tvCtx;
    const W = tvCanvas.width, H = tvCanvas.height;
    // background
    ctx.fillStyle = '#0c0e14';
    ctx.fillRect(0, 0, W, H);
    // subtle scanlines
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);

    // header
    ctx.fillStyle = '#e8ac2e';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText((state.name || 'Sorb'), 24, 36);
    ctx.fillStyle = '#8b93a0';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('cycle ' + String(state.cycle).padStart(3, '0'), 24, 58);

    // mood
    ctx.fillStyle = intruderActive ? '#ff4d7a' : '#c5cdd8';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText('mood  ' + mood, 280, 40);

    // stat bars
    const stats = [
      ['HUNGER', state.hunger],
      ['JOY', state.joy],
      ['ENERGY', state.energy],
      ['CLEAN', state.clean]
    ];
    let y = 88;
    stats.forEach(([label, val]) => {
      const v = Math.round(val);
      ctx.fillStyle = '#8b93a0';
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText(label, 24, y);
      ctx.fillStyle = '#1a1e28';
      ctx.fillRect(110, y - 12, 300, 16);
      ctx.fillStyle = barColor(v);
      ctx.fillRect(110, y - 12, Math.max(2, 300 * (v / 100)), 16);
      ctx.fillStyle = '#e8ecf2';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText(String(v), 420, y);
      y += 36;
    });

    // event / log footer
    ctx.fillStyle = '#151922';
    ctx.fillRect(0, H - 56, W, 56);
    if (intruderActive || eventText) {
      ctx.fillStyle = '#ff4d7a';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.fillText(eventText || 'INTRUDER — HIDE THE SORB', 24, H - 22);
    } else {
      ctx.fillStyle = '#7a8494';
      ctx.font = '14px system-ui, sans-serif';
      const msg = lastTvLog || 'all quiet in the room';
      ctx.fillText(msg.slice(0, 48), 24, H - 22);
    }

    ensureTvTexture();
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function log(msg, cls) {
    ui.log.textContent = msg;
    ui.log.className = cls || '';
    lastTvLog = msg;
  }
  function dist(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  }
  function worldPos(el) {
    const p = new THREE.Vector3();
    el.object3D.getWorldPosition(p);
    return p;
  }

  function updateUI() {
    ui.h.textContent = Math.round(state.hunger);
    ui.j.textContent = Math.round(state.joy);
    ui.e.textContent = Math.round(state.energy);
    ui.c.textContent = Math.round(state.clean);
    ui.name.textContent = state.name || 'Sorb';
    ui.cycle.textContent = String(state.cycle).padStart(3, '0');
    const avg = (state.hunger + state.joy + state.energy + state.clean) / 4;
    let mood = 'content';
    if (intruderActive) mood = 'terrified';
    else if (state.sleeping) mood = 'asleep';
    else if (avg > 75) mood = 'radiant';
    else if (avg > 50) mood = 'content';
    else if (avg > 25) mood = 'wilting';
    else mood = 'flickering';
    ui.mood.textContent = 'mood: ' + mood;
    ui.mood.className = intruderActive ? 'warn' : '';

    const eventText = intruderActive ? 'INTRUDER — HIDE THE SORB IN THE BOX' : '';
    if (ui.event) {
      if (intruderActive) {
        ui.event.style.display = 'block';
        ui.event.textContent = eventText;
      }
    }
    drawTVScreen(mood, eventText);

    const body = $('sorbBody');
    const label = $('sorbMood');
    const sorbRoot = $('sorb');
    if (body) {
      // keep billboard texture; only tint / scale for mood
      if (intruderActive) {
        body.setAttribute('material', 'src: #sorbTex; transparent: true; alphaTest: 0.05; side: double; shader: flat; color: #ffb0c0');
        if (label) label.setAttribute('value', '!!');
        if (sorbRoot) sorbRoot.setAttribute('scale', '1.05 1.05 1.05');
      } else if (state.sleeping) {
        body.setAttribute('material', 'src: #sorbTex; transparent: true; alphaTest: 0.05; side: double; shader: flat; color: #c8c8d0');
        if (label) label.setAttribute('value', 'zz');
        if (sorbRoot) sorbRoot.setAttribute('scale', '0.95 0.9 0.95');
      } else {
        body.setAttribute('material', 'src: #sorbTex; transparent: true; alphaTest: 0.05; side: double; shader: flat; color: #ffffff');
        if (label) label.setAttribute('value', '');
        if (sorbRoot) sorbRoot.setAttribute('scale', '1 1 1');
      }
    }
    const threat = $('threatLight');
    if (threat) threat.setAttribute('light', 'type: point; color: #ff2d6a; intensity: ' + (intruderActive ? 1.4 : 0) + '; distance: 8');
  }

  function gameOver(reason) {
    state.alive = false;
    save();
    stopIntruderAudio();
    stopBg();
    log(reason || 'the light went out.', 'warn');
    ui.event.style.display = 'block';
    ui.event.textContent = 'SIGNAL LOST — refresh to restart';
  }

  function startIntruder() {
    if (!state.alive || intruderActive || sorbHidden) return;
    intruderActive = true;
    state.lastIntruderCycle = state.cycle;
    state.joy = clamp(state.joy - 10);
    state.energy = clamp(state.energy - 6);
    ui.event.style.display = 'block';
    ui.event.textContent = 'INTRUDER — grab the Sorb and put it in the HIDE BOX';
    log('something is in the room. hide the Sorb in the box!', 'warn');
    startIntruderAudio();
    updateUI();
    const windowMs = 9000 + Math.random() * 4000;
    intruderTimer = setTimeout(() => {
      if (!intruderActive) return;
      if (sorbHidden) return;
      intruderActive = false;
      ui.event.style.display = 'none';
      stopIntruderAudio();
      gameOver('the intruder found the Sorb.');
      updateUI();
    }, windowMs);
    save();
  }

  function endIntruderSuccess() {
    if (!intruderActive) return;
    intruderActive = false;
    if (intruderTimer) { clearTimeout(intruderTimer); intruderTimer = null; }
    ui.event.style.display = 'none';
    state.joy = clamp(state.joy + 8);
    stopIntruderAudio();
    log('safe. the footsteps fade.', 'good');
    updateUI();
    save();
    // release after a moment
    setTimeout(() => {
      sorbHidden = false;
      const sorb = $('sorb');
      if (sorb) {
        sorb.setAttribute('position', homePos.sorb);
        sorb.setAttribute('look-at', '#cam');
      }
      log('the Sorb peeks out again, still shaky.', 'good');
    }, 2800);
  }

  // --- Grab system (desktop cursor + VR laser / grip / pinch) ---
  const hoverByHand = { left: null, right: null };
  const homePos = {
    sponge: { x: -0.4, y: 0.28, z: 1.2 },
    light: { x: 0.4, y: 0.38, z: 1.2 },
    cushion: { x: 0, y: 0.1, z: 1.4 },
    sorb: { x: 0, y: 0.85, z: 1.05 }
  };

  function kindOf(el) {
    if (!el) return 'object';
    const comp = el.components && el.components['grabbable-object'];
    if (comp && comp.data && comp.data.kind) return comp.data.kind;
    const dk = el.getAttribute('data-kind');
    if (dk) return dk;
    // fallback by element id
    const id = el.id || '';
    if (id === 'sponge') return 'sponge';
    if (id === 'feedLight') return 'light';
    if (id === 'cushion') return 'cushion';
    if (id === 'sorb') return 'sorb';
    return 'object';
  }

  function findGrabbableEl(startEl) {
    let el = startEl;
    while (el) {
      if (el.classList && el.classList.contains('grabbable')) return el;
      el = el.parentElement;
    }
    return null;
  }

  function findGrabbableFromIntersection(hit) {
    if (!hit) return null;
    return findGrabbableEl(hit.object && hit.object.el);
  }

  function nearestGrabbableToHand(handEl, maxDist) {
    if (!handEl || !handEl.object3D) return null;
    const hp = new THREE.Vector3();
    handEl.object3D.getWorldPosition(hp);
    let best = null, bestD = maxDist || 0.45;
    ['sorb', 'sponge', 'feedLight', 'cushion'].forEach((id) => {
      const el = $(id);
      if (!el || !el.object3D) return;
      const p = new THREE.Vector3();
      el.object3D.getWorldPosition(p);
      const d = hp.distanceTo(p);
      if (d < bestD) { bestD = d; best = el; }
    });
    return best;
  }

  function grabEntity(el, handEl) {
    if (!el || held) return;
    const kindFinal = kindOf(el);

    // Care tools: apply immediately on grab (Quest-friendly — no carry needed)
    if (kindFinal === 'sponge' || kindFinal === 'light' || kindFinal === 'cushion') {
      const ok = applyTool(kindFinal);
      if (ok) {
        // tiny hand flash then snap home
        if (handEl && handEl.object3D && el.object3D) {
          try {
            handEl.object3D.attach(el.object3D);
            el.object3D.position.set(0, 0, -0.25);
            setTimeout(() => {
              const scene = document.querySelector('a-scene');
              if (el.object3D && scene && scene.object3D) scene.object3D.attach(el.object3D);
              if (kindFinal === 'sponge') el.setAttribute('position', homePos.sponge);
              if (kindFinal === 'light') el.setAttribute('position', homePos.light);
              if (kindFinal === 'cushion') el.setAttribute('position', homePos.cushion);
            }, 180);
          } catch (e) {
            if (kindFinal === 'sponge') el.setAttribute('position', homePos.sponge);
            if (kindFinal === 'light') el.setAttribute('position', homePos.light);
            if (kindFinal === 'cushion') el.setAttribute('position', homePos.cushion);
          }
        }
      }
      return;
    }

    // Sorb (and anything else): hold and carry
    held = { el, kind: kindFinal, handEl: handEl || null };

    if (el.components && el.components['look-at']) {
      el.removeAttribute('look-at');
    }

    if (handEl && handEl.object3D && el.object3D) {
      handEl.object3D.attach(el.object3D);
      el.object3D.position.set(0, 0, -0.3);
      el.object3D.quaternion.identity();
      el.object3D.scale.set(1, 1, 1);
    }
    if (kindFinal === 'sorb' && intruderActive) {
      log('holding Sorb — put it in the HIDE BOX!', 'warn');
    } else {
      log('holding ' + kindFinal, 'good');
    }
  }

  function releaseHeld() {
    if (!held) return;
    const { el, kind } = held;
    const sorb = $('sorb');
    const box = $('hideBox');
    const scene = document.querySelector('a-scene');

    // Unparent back into the scene, keep world position
    if (el && el.object3D && scene && scene.object3D) {
      scene.object3D.attach(el.object3D);
    }

    // Sync A-Frame position attribute from world transform
    if (el && el.object3D) {
      const wp = new THREE.Vector3();
      el.object3D.getWorldPosition(wp);
      el.setAttribute('position', { x: wp.x, y: wp.y, z: wp.z });
    }

    // Re-read world positions AFTER unparent
    if (kind === 'sorb' && intruderActive && box) {
      const sp = worldPos(el);
      const bp = worldPos(box);
      if (dist(sp, bp) < 1.6) {
        sorbHidden = true;
        el.setAttribute('position', { x: 0.55, y: 0.75, z: 1.15 });
        held = null;
        endIntruderSuccess();
        return;
      }
    }

    // Care tools always apply on release (backup if instant-grab didn't fire)
    if (kind === 'sponge' || kind === 'light' || kind === 'cushion') {
      applyTool(kind);
    }

    // snap tools home; leave sorb where dropped
    if (kind === 'sponge') el.setAttribute('position', homePos.sponge);
    if (kind === 'light') el.setAttribute('position', homePos.light);
    if (kind === 'cushion') el.setAttribute('position', homePos.cushion);
    if (kind === 'sorb' && !sorbHidden) {
      const p = el.getAttribute('position');
      el.setAttribute('position', { x: p.x, y: Math.max(0.9, p.y), z: p.z });
      el.setAttribute('look-at', '#cam');
    }
    held = null;
  }

  function pulseSorb() {
    const body = $('sorbBody');
    if (!body) return;
    body.setAttribute('scale', '1.15 1.15 1.15');
    setTimeout(() => body.setAttribute('scale', '1 1 1'), 220);
  }

  function applyTool(kind) {
    if (intruderActive) {
      log('too dangerous — hide the Sorb first!', 'warn');
      return false;
    }
    const now = Date.now();
    if (now - lastAction < 500) return false;
    lastAction = now;

    // Care always works — even if a need hit zero (revives the Sorb)
    if (!state.alive) {
      state.alive = true;
      ui.event.style.display = 'none';
      log('the Sorb stirs back to life…', 'good');
    }

    if (kind === 'sponge') {
      state.clean = clamp(state.clean + 35);
      state.joy = clamp(state.joy + 5);
      log('sponge bath! clean and sparkly.', 'good');
    } else if (kind === 'light') {
      state.hunger = clamp(state.hunger + 35);
      state.joy = clamp(state.joy + 6);
      log('yum — warm light! hunger goes up.', 'good');
    } else if (kind === 'cushion') {
      state.sleeping = !state.sleeping;
      if (state.sleeping) {
        state.energy = clamp(state.energy + 30);
        log('nap time. energy rising…', 'good');
      } else {
        state.energy = clamp(state.energy + 8);
        log('the Sorb wakes with a soft glow.', 'good');
      }
    } else {
      return false;
    }
    pulseSorb();
    updateUI();
    save();
    return true;
  }

  // Called every frame while holding a care item near the Sorb
  function tryUseHeldOnSorb() {
    if (!held) return;
    const { el, kind } = held;
    if (kind !== 'sponge' && kind !== 'light' && kind !== 'cushion') return;
    const sorb = $('sorb');
    if (!sorb || !el || !el.object3D || !sorb.object3D) return;
    const op = new THREE.Vector3();
    const sp = new THREE.Vector3();
    el.object3D.getWorldPosition(op);
    sorb.object3D.getWorldPosition(sp);
    // very forgiving range — whole arm reach
    if (op.distanceTo(sp) < 2.8) {
      if (applyTool(kind)) {
        const scene = document.querySelector('a-scene');
        if (el.object3D && scene && scene.object3D) scene.object3D.attach(el.object3D);
        if (kind === 'sponge') el.setAttribute('position', homePos.sponge);
        if (kind === 'light') el.setAttribute('position', homePos.light);
        if (kind === 'cushion') el.setAttribute('position', homePos.cushion);
        held = null;
      }
    }
  }

  function tryHideHeldSorb() {
    if (!held || held.kind !== 'sorb' || !intruderActive) return;
    const box = $('hideBox');
    const el = held.el;
    if (!box || !el || !el.object3D) return;
    const op = new THREE.Vector3();
    const bp = new THREE.Vector3();
    el.object3D.getWorldPosition(op);
    box.object3D.getWorldPosition(bp);
    if (op.distanceTo(bp) < 1.4) {
      const scene = document.querySelector('a-scene');
      if (el.object3D && scene && scene.object3D) scene.object3D.attach(el.object3D);
      sorbHidden = true;
      el.setAttribute('position', { x: 0.55, y: 0.75, z: 1.15 });
      held = null;
      endIntruderSuccess();
    }
  }

  // A-Frame component for metadata
  AFRAME.registerComponent('grabbable-object', {
    schema: { kind: { type: 'string', default: 'object' } }
  });

  // Desktop mouse grab via cursor
  const sceneEl = document.querySelector('a-scene');
  sceneEl.addEventListener('loaded', () => {
    updateUI();
    // canvas texture needs mesh ready — retry a few times
    [100, 400, 1000].forEach((ms) => setTimeout(() => updateUI(), ms));
    log('sun sorb vr online — keep it warm.', 'good');

    const cursor = $('cursor');
    let dragging = false;

    sceneEl.addEventListener('mousedown', (e) => {
      // ray from camera handled by cursor intersect
    });

    // Use cursor intersection events
    const cam = $('cam');
    document.addEventListener('keydown', (ev) => {
      unlockAudio();
      const k = ev.key.toLowerCase();
      if (k === 'm') {
        muted = !muted;
        applyMute();
        if (!muted) playBg();
        log(muted ? 'muted' : 'sound on', '');
        return;
      }
      if (!state.alive) return;
      if (k === 'e') applyTool('light');
      if (k === 'q') applyTool('sponge');
      if (k === 'r') applyTool('cushion');
      if (k === 'f') {
        const sorb = $('sorb');
        if (!held) grabEntity(sorb);
        else releaseHeld();
      }
      if (k === 'h' && intruderActive) {
        // quick-hide if holding sorb or force into box
        const sorb = $('sorb');
        sorbHidden = true;
        sorb.setAttribute('position', { x: 0.55, y: 0.75, z: 1.15 });
        endIntruderSuccess();
      }
      if (k === 'i') {
        // debug: force intruder
        startIntruder();
      }
      if (k === ' ') {
        if (held) releaseHeld();
      }
    });
    // browsers block audio until a user gesture
    ['pointerdown', 'touchstart', 'click'].forEach((evt) => {
      document.addEventListener(evt, () => unlockAudio(), { once: false });
    });

    // Click on grabbables
    ['sorb', 'sponge', 'feedLight', 'cushion'].forEach((id) => {
      const el = $(id);
      if (!el) return;
      el.classList.add('grabbable');
      el.addEventListener('click', () => {
        if (held && held.el === el) releaseHeld();
        else if (!held) grabEntity(el);
        else {
          releaseHeld();
          grabEntity(el);
        }
      });
    });

    // Drag held object in front of camera on desktop
    sceneEl.addEventListener('enter-vr', () => {
      $('enterVR').style.display = 'none';
      $('hint').textContent = 'Left stick: walk · TRIGGER/GRIP on LIGHT·SPONGE·REST to use · Grab Sorb → HIDE BOX when threatened';
      unlockAudio();
      playBg();
    });
    sceneEl.addEventListener('exit-vr', () => {
      $('enterVR').style.display = 'block';
    });

    // Room collision bounds (inside walls / under ceiling)
    const ROOM = { minX: -3.55, maxX: 3.55, minZ: -3.55, maxZ: 3.55 };
    const MOVE_SPEED = 2.4; // m/s

    function readThumbstick() {
      // Prefer live XR session gamepads (Quest)
      try {
        const session = sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.getSession && sceneEl.renderer.xr.getSession();
        if (session) {
          for (const source of session.inputSources) {
            // Prefer left stick for locomotion (Quest convention)
            if (source.handedness !== 'left' && source.handedness !== 'right') continue;
            const gp = source.gamepad;
            if (!gp || !gp.axes) continue;
            // Oculus Touch: axes[2]=x, axes[3]=y for thumbstick
            let x = 0, y = 0;
            if (gp.axes.length >= 4) {
              x = gp.axes[2] || 0;
              y = gp.axes[3] || 0;
            }
            if (Math.abs(x) < 0.05 && Math.abs(y) < 0.05 && gp.axes.length >= 2) {
              x = gp.axes[0] || 0;
              y = gp.axes[1] || 0;
            }
            if (Math.abs(x) > 0.12 || Math.abs(y) > 0.12) {
              // Prefer left hand stick when both active
              if (source.handedness === 'left') return { x, y };
              if (source.handedness === 'right') return { x, y };
            }
          }
        }
      } catch (e) {}
      // Fallback: any connected gamepad
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (!gp || !gp.axes) continue;
        let x = gp.axes[2] != null ? gp.axes[2] : gp.axes[0] || 0;
        let y = gp.axes[3] != null ? gp.axes[3] : gp.axes[1] || 0;
        if (Math.abs(x) > 0.12 || Math.abs(y) > 0.12) return { x, y };
      }
      return null;
    }

    function applyLocomotion(dt) {
      const stick = readThumbstick();
      if (!stick) return;
      const mag = Math.hypot(stick.x, stick.y);
      if (mag < 0.15) return;

      const rigEl = $('rig');
      const camEl = $('cam');
      if (!rigEl || !camEl) return;

      // Move relative to headset yaw (ignore pitch)
      const euler = new THREE.Euler(0, 0, 0, 'YXZ');
      euler.setFromQuaternion(camEl.object3D.getWorldQuaternion(new THREE.Quaternion()));
      const yaw = euler.y;
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

      // stick.y forward/back (inverted on many pads: up is negative)
      const fwdAmt = -stick.y;
      const strAmt = stick.x;
      const move = new THREE.Vector3();
      move.addScaledVector(forward, fwdAmt);
      move.addScaledVector(right, strAmt);
      if (move.lengthSq() < 0.0001) return;
      move.normalize().multiplyScalar(MOVE_SPEED * dt * Math.min(1, mag));

      const pos = rigEl.object3D.position;
      let nx = pos.x + move.x;
      let nz = pos.z + move.z;
      // Wall collision — clamp inside room
      nx = Math.max(ROOM.minX, Math.min(ROOM.maxX, nx));
      nz = Math.max(ROOM.minZ, Math.min(ROOM.maxZ, nz));
      pos.x = nx;
      pos.z = nz;
      pos.y = 0; // keep on floor (ceiling prevents flying via no vertical stick move)
      rigEl.setAttribute('position', { x: nx, y: 0, z: nz });
    }

    // Tick: desktop drag + VR locomotion + care checks
    sceneEl.addEventListener('renderstart', () => {
      const camEl = $('cam');
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (held && held.el && !sceneEl.is('vr-mode')) {
          const camObj = camEl.object3D;
          const dir = new THREE.Vector3(0, 0, -1);
          dir.applyQuaternion(camObj.quaternion);
          const target = new THREE.Vector3();
          camObj.getWorldPosition(target);
          target.addScaledVector(dir, 1.15);
          if (held.kind === 'sorb') target.y = Math.max(0.5, target.y);
          if (held.kind === 'sponge' || held.kind === 'cushion') target.y = Math.max(0.2, target.y - 0.15);
          held.el.object3D.position.lerp(target, 1 - Math.pow(0.001, dt));
        }
        // Quest joystick walk
        if (sceneEl.is('vr-mode')) applyLocomotion(dt);
        tryUseHeldOnSorb();
        tryHideHeldSorb();
        if (intruderActive && !sorbHidden) {
          const s = $('sorb');
          if (s && !held) {
            const base = s.object3D.position;
            base.x += (Math.random() - 0.5) * 0.01;
            base.z += (Math.random() - 0.5) * 0.01;
          }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });

    // VR grab: laser hover + trigger/grip/pinch + near-hand grab
    function bindHand(handEl, side) {
      if (!handEl) return;
      handEl.dataset.handSide = side;

      handEl.addEventListener('raycaster-intersection', (e) => {
        const els = e.detail && e.detail.els;
        hoverByHand[side] = null;
        if (els && els.length) {
          for (let i = 0; i < els.length; i++) {
            const g = findGrabbableEl(els[i]);
            if (g) { hoverByHand[side] = g; break; }
          }
        }
      });
      handEl.addEventListener('raycaster-intersection-cleared', () => {
        hoverByHand[side] = null;
      });

      function resolveTarget() {
        if (hoverByHand[side]) return hoverByHand[side];
        const ray = handEl.components.raycaster;
        const hits = (ray && ray.intersections) || [];
        if (hits.length) {
          const g = findGrabbableFromIntersection(hits[0]);
          if (g) return g;
        }
        // near-grab: hand close to object
        return nearestGrabbableToHand(handEl, 0.95);
      }

      function tryGrab() {
        if (held) return;
        const target = resolveTarget();
        if (target) grabEntity(target, handEl);
        else log('point at sponge / light / rest / sorb, then squeeze trigger', '');
      }

      function tryRelease() {
        if (held && (!held.handEl || held.handEl === handEl)) releaseHeld();
      }

      // Quest 3 controllers: index trigger, side grip
      // Hand tracking: pinch → selectstart / pinchstarted
      const downEvts = ['triggerdown', 'gripdown', 'selectstart', 'pinchstarted', 'mousedown'];
      const upEvts = ['triggerup', 'gripup', 'selectend', 'pinchended', 'mouseup'];
      downEvts.forEach((evt) => handEl.addEventListener(evt, tryGrab));
      upEvts.forEach((evt) => handEl.addEventListener(evt, tryRelease));

      // A-Frame abutton/xbutton sometimes used
      handEl.addEventListener('abuttondown', tryGrab);
      handEl.addEventListener('xbuttondown', tryGrab);
      handEl.addEventListener('abuttonup', tryRelease);
      handEl.addEventListener('xbuttonup', tryRelease);
    }
    bindHand($('leftHand'), 'left');
    bindHand($('rightHand'), 'right');

    // Fallback: click events from Quest browser mapping trigger → click on intersected mesh
    document.querySelectorAll('.grabbable').forEach((el) => {
      el.addEventListener('click', () => {
        if (!sceneEl.is('vr-mode')) return;
        if (held && held.el === el) {
          releaseHeld();
          return;
        }
        if (!held) {
          const hand = hoverByHand.right ? $('rightHand') : (hoverByHand.left ? $('leftHand') : $('rightHand'));
          grabEntity(el, hand);
        }
      });
    });

    // Poll XR gamepads — most reliable path on Quest Browser when events are flaky
    const pressed = { left: false, right: false };
    function pollXRButtons() {
      if (!sceneEl.is('vr-mode')) return;
      const session = sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.getSession && sceneEl.renderer.xr.getSession();
      if (!session) return;
      for (const source of session.inputSources) {
        const side = source.handedness; // 'left' | 'right' | 'none'
        if (side !== 'left' && side !== 'right') continue;
        const gp = source.gamepad;
        if (!gp) continue;
        // buttons[0] = trigger, buttons[1] = squeeze/grip on most XR pads
        const down = (gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[1] && gp.buttons[1].pressed);
        const handEl = side === 'left' ? $('leftHand') : $('rightHand');
        if (down && !pressed[side]) {
          pressed[side] = true;
          if (!held) {
            const target = hoverByHand[side] || nearestGrabbableToHand(handEl, 1.0);
            if (!target) {
              const ray = handEl && handEl.components.raycaster;
              const hits = (ray && ray.intersections) || [];
              if (hits.length) {
                const g = findGrabbableFromIntersection(hits[0]);
                if (g) grabEntity(g, handEl);
              }
            } else {
              grabEntity(target, handEl);
            }
          }
        } else if (!down && pressed[side]) {
          pressed[side] = false;
          if (held && held.handEl === handEl) releaseHeld();
        }
      }
    }
    setInterval(pollXRButtons, 50);

    // Simulation tick
    setInterval(() => {
      if (!state.alive) return;
      state.seconds += 4;
      const sleepMod = state.sleeping ? 0.35 : 1;
      state.hunger = clamp(state.hunger - (1.6 + Math.random()) * sleepMod);
      state.joy = clamp(state.joy - (1.2 + Math.random()) * sleepMod);
      state.energy = clamp(state.energy - (state.sleeping ? -1.5 : 1.4 + Math.random()));
      state.clean = clamp(state.clean - (1.1 + Math.random() * 0.8) * sleepMod);
      if (state.seconds % 60 < 4) state.cycle += 1;

      // intruder chance
      if (!intruderActive && state.cycle > 2 && state.cycle - (state.lastIntruderCycle || 0) > 2) {
        if (Math.random() < 0.08) startIntruder();
      }

      const anyZero = state.hunger <= 0 || state.joy <= 0 || state.energy <= 0 || state.clean <= 0;
      if (anyZero) {
        zeroNeedStreak += 1;
        if (zeroNeedStreak === 1) {
          log('a need is empty — feed / sponge / rest the Sorb!', 'warn');
          ui.event.style.display = 'block';
          ui.event.textContent = 'NEED EMPTY — hold LIGHT / SPONGE / REST near the Sorb';
        }
        // only true game over after ~20s of neglect while at zero
        if (zeroNeedStreak >= 5) {
          gameOver('a need stayed empty too long. the glow fades.');
        }
      } else {
        zeroNeedStreak = 0;
        if (!intruderActive && ui.event && ui.event.textContent && ui.event.textContent.indexOf('NEED EMPTY') === 0) {
          ui.event.style.display = 'none';
        }
      }
      updateUI();
      save();
    }, 4000);
  });

  $('enterVR').addEventListener('click', () => {
    unlockAudio();
    playBg();
    const sc = document.querySelector('a-scene');
    if (sc && sc.enterVR) sc.enterVR();
  });
})();
</script>
</body>
</html>
